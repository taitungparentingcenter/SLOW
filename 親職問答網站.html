<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>照顧者親職問答</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* VOICE: warm, steady, plain-spoken — a handbook a tired caregiver can open at 11pm.
   IDEA: a well-thumbed caregiver handbook with coloured index tabs.
   PICTURE: the search box and the tabbed category index are the picture.
   COLOUR and TYPE: apricot field, deep cocoa ink, sky-blue accent; Noto Sans TC 900/700/400.
   LAYOUT: apricot band (title, search, index tabs) → sticky tab strip → question cards → footer notes. */
:root{color-scheme:light dark;
--bg:light-dark(#fffaf3,#1d1712);--ink:light-dark(#2b2118,#f4ebe0);--soft:light-dark(#6b5a4a,#c8b7a5);
--band:light-dark(#f6b04a,#5a3a14);--bandink:light-dark(#2b1a08,#fbe9d2);
--card:light-dark(#ffffff,#2a211a);--line:light-dark(#efe2d1,#3d3127);
--acc:light-dark(#1f6fa8,#7cc0ee);--accbg:light-dark(#e6f1fa,#1d3446);
--tab:light-dark(#fff3e1,#3a2a1b);--tabon:light-dark(#2b2118,#f4ebe0);--tabonink:light-dark(#fffaf3,#1d1712)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16.5px/1.75 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;overflow-x:clip}
.band{padding:clamp(28px,4vw,56px) max(5vw,16px)}
.wrap{max-width:1180px;margin:0 auto}
header.band{background:var(--band);color:var(--bandink);padding-bottom:clamp(24px,3vw,40px)}
h1{font-size:clamp(30px,4.6vw,48px);line-height:1.15;font-weight:900;margin:0 0 8px;text-wrap:balance}
.lede{margin:0 0 22px;max-width:62ch;font-size:17px}
.search{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:16px;padding:6px 6px 6px 18px;box-shadow:0 6px 0 rgba(43,26,8,.18);max-width:760px}
.search svg{flex:none;color:var(--soft)}
.search input{flex:1;border:0;background:transparent;font:inherit;font-size:18px;color:var(--ink);padding:12px 4px;outline:none}
.search button{border:0;background:var(--tab);color:var(--ink);font:inherit;font-size:15px;border-radius:12px;padding:10px 14px;min-height:44px;cursor:pointer}
.search:focus-within{outline:3px solid var(--acc);outline-offset:3px}
.hint{font-size:14px;margin:12px 0 0;opacity:.85}
.index{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:26px}
.idx{display:flex;flex-direction:column;gap:2px;text-align:left;border:0;cursor:pointer;font:inherit;color:var(--ink);background:var(--tab);border-radius:14px 14px 14px 4px;padding:14px 16px;min-height:84px;box-shadow:0 3px 0 rgba(43,26,8,.15);transition:transform .15s}
.idx:hover{transform:translateY(-2px)}
.idx b{font-size:16.5px;line-height:1.35}
.idx span{font-size:13.5px;color:var(--soft)}
.idx.feat{background:var(--card)}
.idx.on{background:var(--tabon);color:var(--tabonink)}.idx.on span{color:inherit;opacity:.8}
.idx:focus-visible,.chip:focus-visible,summary:focus-visible,.kw:focus-visible,button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
nav.strip{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
nav.strip .wrap{display:flex;gap:8px;overflow-x:auto;padding:10px max(5vw,16px);scrollbar-width:thin}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:14.5px;border-radius:999px;padding:8px 14px;min-height:40px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--tabon);color:var(--tabonink);border-color:var(--tabon)}
main.band{padding-top:28px;scroll-margin-top:60px}
@media(max-width:600px){main.band{scroll-margin-top:0}}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:18px}
h2{font-size:clamp(24px,3vw,32px);line-height:1.2;margin:0;font-weight:900;text-wrap:balance}
.desc{margin:4px 0 0;color:var(--soft);max-width:65ch}
.back{display:none;align-items:center;gap:4px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:14.5px;border-radius:999px;padding:6px 14px;min-height:40px;cursor:pointer;margin-bottom:12px}
.tog{display:flex;align-items:center;gap:8px;font-size:14.5px;color:var(--soft);cursor:pointer;min-height:44px}
.tog input{width:20px;height:20px;accent-color:var(--acc)}
.list{display:grid;gap:12px}
details.q{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
details.q summary{list-style:none;cursor:pointer;padding:16px 20px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center}
details.q summary::-webkit-details-marker{display:none}
.no{font-size:13px;color:var(--soft);font-variant-numeric:tabular-nums;width:2.6em}
.qt{font-weight:700;font-size:17.5px;line-height:1.45}
.qt small{display:block;font-weight:400;font-size:13.5px;color:var(--soft);margin-top:2px}
.arr{transition:transform .2s;color:var(--soft)}
details[open] .arr{transform:rotate(90deg)}
.body{padding:0 20px 20px calc(20px + 2.6em + 14px)}
.ans{white-space:pre-line;margin:0 0 14px;max-width:68ch}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px}
.meta em{font-style:normal;font-size:13.5px;color:var(--soft);margin-right:4px}
.kw{border:0;background:var(--accbg);color:var(--acc);font:inherit;font-size:14px;border-radius:8px;padding:4px 10px;cursor:pointer;min-height:32px}
.who{font-size:13.5px;background:var(--tab);border-radius:8px;padding:4px 10px}
.src summary{cursor:pointer;font-size:14px;color:var(--soft);min-height:32px;display:flex;align-items:center}
.src ul{margin:6px 0 0;padding-left:1.2em;font-size:13.5px;color:var(--soft);line-height:1.6}
.src li{margin-bottom:4px;overflow-wrap:anywhere}
.todo{opacity:.62}.todo summary{cursor:default}
.tag{font-size:12.5px;border:1px dashed var(--soft);border-radius:999px;padding:2px 10px;white-space:nowrap;color:var(--soft)}
.empty{padding:40px 20px;text-align:center;color:var(--soft);background:var(--card);border-radius:16px;border:1px dashed var(--line)}
mark{background:light-dark(#ffe08a,#6b5216);color:inherit;border-radius:3px;padding:0 1px}
footer.band{border-top:1px solid var(--line);font-size:14.5px;color:var(--soft)}
footer .sos{color:var(--ink);font-weight:700;font-size:16px;margin:0 0 8px}
footer p{margin:0 0 6px;max-width:75ch}
@media(max-width:600px){
 .index{grid-template-columns:repeat(2,minmax(0,1fr))}
 .idx{min-height:76px;padding:12px}
 .idx b{font-size:15px}
 details.q summary{grid-template-columns:minmax(0,1fr) auto;padding:14px 16px}
 .no{display:none}
 .body{padding:0 16px 18px}
 .search button{display:none}
 .search input{font-size:16px}
 h1{font-size:28px}
 nav.strip{display:none}
 .back{display:inline-flex}
 .head{flex-direction:column;align-items:stretch;gap:4px}
 .src ul{padding-left:1em}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="band">
 <div class="wrap">
  <h1>照顧安置兒少的親職問答</h1>
  <p class="lede">給照顧者們的實用小指南。孩子哭鬧、生氣、想家的時候，可以先來這裡找方法。</p>
  <form class="search" id="sf" role="search">
   <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
   <input id="q" type="search" placeholder="搜尋，例如：哭鬧、想回家" aria-label="搜尋問答" autocomplete="off">
   <button type="button" id="clr">清除</button>
  </form>
  <p class="hint">這些關鍵字和官方LINE相同，在LINE輸入也能收到同樣的答案。</p>
  <div class="index" id="index"></div>
 </div>
</header>
<nav class="strip" aria-label="分類"><div class="wrap" id="chips"></div></nav>
<main class="band">
 <div class="wrap">
  <div class="head">
   <div><button class="back" id="back" type="button">← 看所有分類</button><h2 id="ht">全部問答</h2><p class="desc" id="hd"></p></div>
   <label class="tog"><input type="checkbox" id="showTodo">顯示即將推出的題目</label>
  </div>
  <div class="list" id="list"></div>
 </div>
</main>
<footer class="band">
 <div class="wrap">
  <p class="sos">若孩子有立即危險，請撥打 119／110；需要協助時，請聯絡您的社工。</p>
  <p>本站內容為一般性親職教育資訊，不能取代專業評估。個別孩子的狀況，請與社工或專業人員討論。</p>
  <p>每則問答都附有參考資料，點開「參考資料」即可查看。</p>
 </div>
</footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
{
let DATA=[{"n": 1, "c": "calm", "t": "孩子哭鬧不休怎麼辦？", "k": ["哭鬧", "一直哭", "大哭", "尖叫", "崩潰"], "a": "全體", "b": "寶貝哭到停不下來，你一定很心疼也很無力。這時孩子的大腦像在「求生模式」，聽不進道理，先別急著講。\n👉 三步驟：\n1️⃣ 先穩住自己：放慢呼吸、放低聲音\n2️⃣ 蹲下來陪著：「我在這裡，你很難過」\n3️⃣ 降低刺激：關小聲音、離開吵雜處\n等孩子平靜了，再簡單聊聊剛剛發生什麼，不追究誰對誰錯。\n⚠️ 避免：把孩子關起來、說「再哭就…」\n你的陪伴，就是最好的安撫。\n💡 小提醒：孩子哭的時候，你不必馬上讓他停，只要讓他知道「有人在」，就已經在幫他了。", "s": ["Perry, B. D. (2009). Examining child maltreatment through a neurodevelopmental lens. Journal of Loss and Trauma, 14(4), 240-255.", "Siegel, D. & Bryson, T. (2011). The Whole-Brain Child.", "Bath, H. (2008). Calming together. Reclaiming Children and Youth, 16(4), 44-46."], "done": true}, {"n": 2, "c": "trauma", "t": "孩子為什麼好像「故意」惹我生氣？", "k": ["故意", "挑釁", "試探", "惹我生氣"], "a": "全體", "b": "孩子「測試」你，常是在確認：「你會不會跟以前的大人一樣不要我？」這是過去經驗留下的求生習慣，不是針對你，也不代表你教得不好。\n👉 怎麼做：\n• 就事論事，不翻舊帳：「這件事不行，但我還是喜歡你」\n• 少一點大吼，多一點平穩的語氣\n• 說到做到，讓孩子預測得到你的反應\n• 事後給一個微笑或小擁抱，修復氣氛\n持續穩定地回應，孩子才會慢慢相信。\n💡 小提醒：孩子鬧得最兇的時候，常是他最需要被接住的時候，先穩住自己，再回應他。", "s": ["Purvis, K. B., Cross, D. R., & Sunshine, W. L. (2007). The Connected Child. McGraw-Hill.", "Hughes, D. A. (2009). Attachment-focused parenting. W. W. Norton (PACE 模式)."], "done": true}, {"n": 3, "c": "trauma", "t": "什麼是創傷反應？孩子的行為跟過去有關嗎？", "k": ["創傷", "創傷反應", "受傷經驗"], "a": "全體", "b": "孩子經歷過虐待、忽視、分離，身體和大腦會留下「警報系統」。之後遇到類似的聲音、氣味、情境，就可能突然哭、暴怒、發呆或逃跑，這就是創傷反應，不是孩子壞，也不是故意跟你作對。\n👉 先問自己：「他是壞，還是在害怕？」\n👉 記下是什麼情境讓他反應變大，和社工、治療師討論。\n👉 事發當下先安撫，不急著講道理。\n理解，是改變的第一步。\n💡 小提醒：你不需要知道孩子經歷過什麼細節，只要用穩定、安全的方式回應，就是在幫他。", "s": ["Perry, B. D. (2009). Examining child maltreatment through a neurodevelopmental lens. Journal of Loss and Trauma, 14(4), 240-255.", "Grillo, C. A., Lott, D. A., & NCTSN Foster Care Subcommittee (2010). Caring for Children Who Have Experienced Trauma: A Workshop for Resource Parents. NCTSN.", "Felitti, V. J., et al. (1998). Adverse childhood experiences (ACE Study). American Journal of Preventive Medicine, 14(4), 245-258.（背景資料：不良童年經驗與後續健康風險）"], "done": true}, {"n": 4, "c": "calm", "t": "孩子突然暴怒、摔東西怎麼辦？", "k": ["暴怒", "摔東西", "發飆", "爆氣"], "a": "全體", "b": "孩子暴怒時，先顧安全，再談行為。你不需要馬上讓他停下來，先讓場面不要更糟就是成功。\n👉 這樣做：\n1️⃣ 移開危險物品，保持距離但留在孩子看得到的地方\n2️⃣ 用短句：「我在，你很生氣，我陪你」\n3️⃣ 不講道理、不爭輸贏\n4️⃣ 平靜後再整理：一起收拾、討論「下次生氣可以怎麼做」\n⚠️ 若有傷人或自傷風險，請立即求援（119／110）。\n💡 小提醒：暴怒的當下不是教導的好時機，等雙方都平靜了，孩子才聽得進去。", "s": ["Bath, H. (2008). Calming together. Reclaiming Children and Youth, 16(4), 44-46.", "Perry, B. D. (2009). Journal of Loss and Trauma, 14(4), 240-255."], "done": true}, {"n": 5, "c": "trauma", "t": "孩子被「觸發」時有哪些徵兆？", "k": ["觸發", "地雷", "反應過度"], "a": "全體", "b": "「觸發」是孩子遇到讓他想起過去的人事物，身體馬上拉警報。常見徵兆：突然變臉、全身僵硬、反應特別大、說「我不要」「你討厭我」。\n👉 你可以：\n• 記下事發前的狀況（聲音、氣味、被碰觸、大聲說話）\n• 能避就先避，不能避就提前預告\n• 事發時先安撫，不急著問原因\n把觸發點整理成清單，和社工、治療師分享，讓家裡、學校的大人用一致的方式回應。\n💡 小提醒：每個孩子的觸發點不同，慢慢累積觀察，你會越來越懂他，也越來越好應對。", "s": ["NCTSN. Caring for Children Who Have Experienced Trauma: A Workshop for Resource Parents.", "Purvis et al. (2007). The Connected Child."], "done": true}, {"n": 6, "c": "trauma", "t": "怎麼幫孩子建立安全感？", "k": ["安全感", "沒安全感", "很警戒"], "a": "全體", "b": "安全感不是一天蓋好的，而是靠每天「說到做到」累積。孩子會從你的小小行動，判斷這個家可不可靠、大人會不會突然改變。\n👉 三個重點：\n1️⃣ 固定作息：吃飯、睡覺時間盡量一樣\n2️⃣ 提前預告：「等一下要出門，大概一小時」\n3️⃣ 守住承諾，做不到就先說明原因\n再多說一句：「你在這裡很安全」。\n💡 教保員輪班時，請盡量用一致的說法和規則，讓孩子不用猜。\n💡 小提醒：就算偶爾做不到也沒關係，說明原因、道歉並調整，孩子一樣會感受到你的在乎。", "s": ["Bath, H. (2008). The three pillars of trauma-informed care. Reclaiming Children and Youth, 17(3), 17-21."], "done": true}, {"n": 7, "c": "trauma", "t": "孩子突然發呆、凍住、叫不太醒？", "k": ["發呆", "凍結", "解離", "沒反應"], "a": "全體", "b": "孩子突然呆住、眼神放空、叫不太醒，可能是身體在「關機自保」，不是故意不理你。這時候罵他或催他，只會讓他更退縮。\n👉 這樣做：\n• 輕聲叫名字，說「我在你旁邊」\n• 不搖晃、不大聲催促\n• 給一杯水或熟悉的抱枕，讓身體回到現在\n• 回神後簡單說「剛剛你好像很累，現在沒事了」\n若頻繁發生，或叫了很久都沒反應，請與社工討論，安排專業評估。\n💡 小提醒：發呆不一定是壞事，那可能是孩子在保護自己，給他一點時間，也給自己一點耐心。", "s": ["Perry, B. D. (2009). Journal of Loss and Trauma, 14(4), 240-255.", "NCTSN. Caring for Children Who Have Experienced Trauma."], "done": true}, {"n": 8, "c": "calm", "t": "冷靜角落要怎麼用才有效？", "k": ["冷靜角落", "冷靜區", "暫停"], "a": "全體", "b": "冷靜角落不是處罰，而是「陪孩子學會平靜」的地方。重點在於大人陪著，而不是把孩子趕過去。\n👉 做法：\n1️⃣ 平常先布置：軟墊、玩偶、繪本，和孩子一起選\n2️⃣ 情緒來時邀請：「我們去角落坐一下，我陪你」\n3️⃣ 大人陪著，約1～5分鐘，依年齡調整\n4️⃣ 平靜後給個擁抱，再談剛剛的事\n⚠️ 不要當成罰站，也不要讓孩子一個人關在裡面。\n多練習幾次，孩子會更快找到平靜的方法。\n💡 小提醒：一開始孩子可能不願意去，沒關係，先當作一個舒服的小窩，慢慢讓他愛上它。", "s": ["Siegel, D. & Bryson, T. P. (2014). No-Drama Discipline. Bantam.", "Bath, H. (2008). Calming together. Reclaiming Children and Youth, 16(4), 44-46."], "done": true}, {"n": 9, "c": "bond", "t": "我對孩子說了重話，怎麼修復關係？", "k": ["修復", "道歉", "罵太兇"], "a": "全體", "b": "說了重話不用太自責，每個照顧者都會有。重點是「修復」，讓孩子知道關係沒有壞掉，你還是在乎他。\n👉 這樣做：\n1️⃣ 等雙方情緒平穩\n2️⃣ 簡單道歉：「剛剛我大聲了，對不起，那不是你的錯」\n3️⃣ 說明期待：「下次我會先深呼吸」\n4️⃣ 給個擁抱或微笑\n孩子會學到：關係出現裂縫，也可以修好。這對經歷過被拋下的孩子特別重要。\n💡 小提醒：修復不用長篇大論，簡短、真誠、不推卸，就足夠了，重點是你願意回來找他。", "s": ["Tronick, E. Z. & Gianino, A. (1986). Interactive mismatch and repair. Zero to Three, 6(3), 1-6.", "Hughes, D. A. (2009). Attachment-Focused Parenting. W. W. Norton.（含「修復」專章）", "Siegel & Bryson (2014). No-Drama Discipline."], "done": true}, {"n": 10, "c": "settle", "t": "孩子剛到家的第一週，怎麼做比較好？", "k": ["剛到家", "新來", "第一週", "初期"], "a": "全體", "b": "剛到新家，孩子可能很緊張、很安靜或特別吵，都是正常的。他正在觀察：這裡安不安全？大人可不可靠？\n👉 第一週重點：\n• 簡單介紹家：廁所、房間、東西放哪\n• 維持日常，少安排訪客、少出遠門\n• 先觀察他的習慣：愛吃什麼、怕什麼、怎麼睡\n• 多說「你在這裡很安全」\n• 先不急著要求感情，先建立穩定\n慢慢來，你已經做得很好。\n💡 小提醒：孩子的行為在剛到家時可能很不穩定，這不是你做得不好，給彼此一點適應的時間。", "s": ["Fahlberg, V. (1991). A Child's Journey Through Placement. Perspectives Press.", "NCTSN. Caring for Children Who Have Experienced Trauma."], "done": true}, {"n": 11, "c": "settle", "t": "孩子半夜哭醒或睡不著怎麼辦？", "k": ["夜驚", "半夜哭", "睡不著", "惡夢"], "a": "全體", "b": "夜裡哭醒、睡不著，常和不安全感或創傷記憶有關。睡前讓孩子覺得「被陪著、被保護」很重要，白天的作息穩定也有幫助。\n👉 這樣做：\n1️⃣ 睡前固定儀式：洗澡、說故事、道晚安\n2️⃣ 留小夜燈、房門微開\n3️⃣ 哭醒時先抱，輕聲說「你安全，我在」\n4️⃣ 不追問夢的內容\n可讓孩子帶喜歡的玩偶入睡。若長期睡不好，請與社工討論，必要時尋求兒童心智科。\n💡 小提醒：夜裡的陪伴不用太久，但要穩定；大人先照顧好自己的睡眠，也才有力氣陪孩子。", "s": ["Purvis, K. B., Cross, D. R., & Sunshine, W. L. (2007). The Connected Child. McGraw-Hill.", "（兒童睡眠／創傷相關的直接來源待補）"], "done": true}, {"n": 12, "c": "trauma", "t": "孩子不吃東西，或一直藏食物、囤食物？", "k": ["囤食", "挑食", "不吃", "藏食物"], "a": "全體", "b": "孩子藏食物、狼吞虎嚥或很挑食，常是過去「怕沒得吃」。吃，對他來說不只是填飽肚子，而是安全感的來源。\n👉 這樣做：\n• 固定時間提供正餐和點心，讓他知道「一定有」\n• 不強迫吃完，也不拿食物當獎勵或處罰\n• 可放一小籃點心在他拿得到的地方\n• 發現藏食物，不責罵，只說「家裡都有，不用擔心」\n慢慢地，孩子會相信，不再需要囤。\n💡 小提醒：這個習慣可能要好幾個月才會改善，只要食物持續穩定出現，孩子會慢慢放心。", "s": ["Keck, G. C. & Kupecky, R. M. (2002). Parenting the Hurt Child. NavPress.", "Satter, E. (2000). Child of Mine: Feeding with Love and Good Sense. Bull Publishing."], "done": true}, {"n": 13, "c": "expect", "t": "孩子一直問「我什麼時候要回家？」", "k": ["想回家", "什麼時候回去", "我要回家"], "a": "全體", "b": "孩子問「我什麼時候回家？」，代表他很想念、也很不安。你不用有標準答案，穩穩接住他的心情就好，不需要急著解釋或安慰。\n👉 回應原則：\n1️⃣ 先接住情緒：「你很想家，對不對？」\n2️⃣ 誠實但簡單：「這部分我不確定，我會問社工」\n3️⃣ 不承諾做不到的事，不說「馬上」\n4️⃣ 不批評原生家庭\n讓他知道：想家是被允許的。\n💡 小提醒：孩子問了很多次，不是你答得不好，而是他需要一再確認自己是安全的，耐心回應就好。", "s": ["Fahlberg, V. (1991). A Child's Journey Through Placement. Perspectives Press.", "NCTSN. Caring for Children Who Have Experienced Trauma."], "done": true}, {"n": 14, "c": "settle", "t": "孩子很黏人，一刻都不能離開怎麼辦？", "k": ["黏人", "分離焦慮", "跟屁蟲"], "a": "全體", "b": "孩子黏著你，常是「怕你消失」，也代表他開始信任你，把你當成安全的人。\n👉 這樣做：\n• 離開前說清楚：「我去倒垃圾，5分鐘回來」，並準時回來\n• 玩躲貓貓等短暫分開的遊戲，慢慢拉長時間\n• 給可以帶著的小物（你的手帕、照片）\n• 不偷偷離開\n你每次穩定地回來，都是在告訴他：「我不會不見。」\n⚠️ 不要硬推開或責備，他的安全感正在長。\n💡 小提醒：黏人的階段通常會隨著安全感增加而減少，現在多給他一點，之後他會更敢獨立。", "s": ["Marvin, R., Cooper, G., Hoffman, K., & Powell, B. (2002). The Circle of Security Project: Attachment-based intervention with caregiver-pre-school child dyads. Attachment & Human Development, 4(1), 107-124.", "Bowlby, J. (1988). A Secure Base. Basic Books."], "done": true}, {"n": 15, "c": "trauma", "t": "孩子太乖、太客氣，是適應得很好嗎？", "k": ["太乖", "討好", "客氣", "看臉色"], "a": "全體", "b": "孩子太乖、很會看臉色，未必是適應良好，也可能是「不敢犯錯」。他可能覺得要表現好，才能被留下來。\n👉 這樣做：\n1️⃣ 多說：「你可以有不同的想法」\n2️⃣ 讓他做小選擇：穿哪件、吃哪個\n3️⃣ 他犯小錯時語氣平穩，並說「沒關係」\n4️⃣ 鼓勵表達：「你今天開心嗎？」\n當孩子敢鬧一點、敢說不，其實是信任變多的好現象。\n💡 小提醒：不用急著要孩子「放鬆」，你的接納和穩定，會讓他一點一點鬆開緊繃的神經。", "s": ["Purvis et al. (2007). The Connected Child.", "Bath, H. (2008). The three pillars of trauma-informed care. Reclaiming Children and Youth, 17(3), 17-21."], "done": true}, {"n": 16, "c": "settle", "t": "孩子的舊衣服、玩偶、行李要怎麼處理？", "k": ["行李", "舊衣物", "玩偶", "舊物品"], "a": "全體", "b": "對孩子來說，舊衣服、玩偶、行李袋，可能是和過去的連結，也是少數真正屬於他的東西。大人覺得破舊，他可能覺得珍貴。\n👉 這樣做：\n• 不要隨意丟，先問他\n• 破舊的物品，和他商量「要不要幫它找個家」\n• 準備他專屬的櫃子或箱子\n• 想帶去學校的小物，盡量支持\n• 照片、信件等重要物品，請妥善保存\n尊重物品，就是尊重他的人生。\n💡 小提醒：如果空間真的有限，可以拍照留念再一起道別，讓孩子參與決定，會比較好接受。", "s": ["Fahlberg, V. (1991). A Child's Journey Through Placement. Perspectives Press."], "done": true}, {"n": 17, "c": "settle", "t": "家裡有其他孩子，怎麼幫大家適應？", "k": ["手足", "其他孩子", "爭寵", "新成員"], "a": "寄養家庭、團體家庭", "b": "新成員加入，家裡原來的孩子可能吃醋、退步或抗拒；新來的孩子也可能很沒安全感，覺得自己是外人。\n👉 這樣做：\n1️⃣ 事先告知，邀請一起迎接\n2️⃣ 每個孩子每天都有「專屬10分鐘」\n3️⃣ 不比較，也不要求「你要讓弟弟妹妹」\n4️⃣ 家規大家都一樣\n5️⃣ 保護每個人的玩具和空間\n每個孩子都被看見，就不需要爭了。\n💡 小提醒：孩子的反應是在適應變化，不是針對誰，大人多一點公平和耐心，氣氛會慢慢穩定。", "s": ["Fahlberg, V. (1991). A Child's Journey Through Placement. Perspectives Press.", "NCTSN. Caring for Children Who Have Experienced Trauma."], "done": true}, {"n": 18, "c": "settle", "t": "孩子不肯洗澡、換衣服怎麼辦？", "k": ["洗澡", "換衣服", "不洗澡"], "a": "全體", "b": "洗澡要脫衣服、被碰觸，對有創傷經驗的孩子可能很可怕，不是故意不配合。越急著催，他越緊張。\n👉 這樣做：\n• 讓孩子選擇：泡澡或淋浴、水溫、要不要有人陪\n• 年紀較大者自己洗，你在門外\n• 先說清楚每個步驟，再開始\n• 他不想洗時，先從洗手腳開始\n• 用玩具、泡泡增加安心感\n他的身體，由他決定怎麼洗；你陪在旁邊就好。\n💡 小提醒：若孩子對洗澡反應特別大，請記錄發生的情況並告訴社工，必要時尋求專業協助。", "s": ["Purvis et al. (2007). The Connected Child.", "NCTSN. Caring for Children Who Have Experienced Trauma."], "done": true}, {"n": 19, "c": "routine", "t": "寒假怎麼安排，作息才不會亂掉？", "k": ["寒假", "放假", "作息"], "a": "全體", "b": "放假不等於放縱，但也不用抓太緊。有節奏的生活，會讓孩子更有安全感，開學時也比較容易回到軌道。\n👉 這樣做：\n1️⃣ 睡覺和起床時間，與上學日差距盡量不超過1小時\n2️⃣ 一起畫「寒假一天表」：玩、讀書、幫忙家務各留時間\n3️⃣ 每天安排一件「期待的事」，例如散步、做點心\n4️⃣ 每週留1天彈性日\n讓孩子參與安排，他會更願意配合。\n💡 小提醒：每個孩子需要的規律程度不同，寧可寬鬆一點、固定一點，也不要天天都不一樣。", "s": ["Paruthi, S., et al. (2016). Recommended amount of sleep for pediatric populations. Journal of Clinical Sleep Medicine, 12(6), 785-786.", "Bath, H. (2008). The three pillars of trauma-informed care. Reclaiming Children and Youth, 17(3), 17-21."], "done": true}, {"n": 20, "c": "routine", "t": "過年親戚來訪，孩子很緊繃怎麼辦？", "k": ["過年", "親戚", "聚餐", "春節"], "a": "全體", "b": "人多、聲音大、被問東問西，容易讓孩子緊繃。過年的熱鬧，對他可能是壓力。\n👉 事前準備：\n• 先說明誰會來、待多久\n• 和孩子約好暗號，想休息就說「我想去房間」\n• 準備安靜角落和安撫小物\n👉 當天：\n• 親戚問私事，你代答：「我們先吃飯吧」\n• 事先請親友別問家庭背景\n孩子累了就讓他休息，不用硬撐，也不必勉強他表演或寒暄。\n💡 小提醒：你是孩子最信任的人，他看到你站在他這邊，就會比較有勇氣面對陌生的場面。", "s": ["NCTSN. Caring for Children Who Have Experienced Trauma: A Workshop for Resource Parents.", "Purvis, K. B., Cross, D. R., & Sunshine, W. L. (2007). The Connected Child. McGraw-Hill."], "done": true}, {"n": 21, "c": "expect", "t": "過年孩子想見原生家人，怎麼處理？", "k": ["年節探視", "過年探視", "春節探視"], "a": "全體", "b": "孩子想見爸媽，是很自然的心情，過年時特別明顯。你不用替他決定能不能見，但可以陪他度過這段心情。\n👉 重點：\n1️⃣ 能不能見面、怎麼安排，請先與社工確認，依會面探視計畫辦理\n2️⃣ 盡早、誠實告訴孩子結果，避免空等\n3️⃣ 不能見面時，說「我知道你很想他們」，陪他畫張卡片\n4️⃣ 見面前後，留時間讓孩子緩和情緒\n別在孩子面前評論他的家人。\n💡 小提醒：孩子見不到家人時的失落，需要被看見，你的陪伴和傾聽，比任何解釋都重要。", "s": ["Fahlberg, V. (1991). A Child's Journey Through Placement. Perspectives Press.", "Grillo, C. A., Lott, D. A., & NCTSN Foster Care Subcommittee (2010). Caring for Children Who Have Experienced Trauma: A Workshop for Resource Parents. NCTSN.", "兒童及少年福利與權益保障法第60條第3、4項（授權訂定會面探視處理原則；例：臺北市政府社會局辦理兒童及少年保護個案安置期間會面探視處理原則，110年8月16日修正）。他縣市請以當地規定為準。"], "done": true}, {"n": 22, "c": "routine", "t": "孩子收到紅包，怎麼處理比較好？", "k": ["紅包", "壓歲錢"], "a": "全體", "b": "紅包是孩子的，也是很好的理財小課堂。讓他參與決定，比直接收走更有學習效果。\n👉 這樣做：\n1️⃣ 讓孩子開心收下，不要當面收走\n2️⃣ 一起商量用途：存起來、買想要的、分享一點\n3️⃣ 用存錢筒或小帳本，讓他看得到金額\n4️⃣ 金額較大或保管方式，請與社工確認\n⚠️ 不要拿紅包抵家用，也不要當作獎懲。\n讓孩子練習做選擇，也是在學習為自己負責。\n💡 小提醒：孩子拿到紅包很開心，你的分享和討論，會讓他覺得自己被尊重、被信任。", "s": ["Whitebread, D. & Bingham, S. (2013). Habit formation and learning in young children. Money Advice Service."], "done": true}, {"n": 23, "c": "routine", "t": "孩子放假一直賴床、睡到中午？", "k": ["賴床", "睡過頭", "起不來"], "a": "全體", "b": "孩子放假賴床，可能真的累了，也可能是在逃避。先觀察，再慢慢調整，不要一次要求太多。\n👉 這樣做：\n1️⃣ 前一兩天先讓他補眠\n2️⃣ 之後每天把起床時間提早15分鐘\n3️⃣ 起床後拉開窗簾、曬曬太陽\n4️⃣ 準備他愛吃的早餐，當作起床動力\n5️⃣ 睡前一小時關掉螢幕\n不必天天催，用固定節奏帶他，比硬拉起床有效。\n💡 小提醒：如果孩子連續好幾天都沒精神、不想起床，請留意情緒狀況，並與社工或醫師討論。", "s": ["Paruthi, S., et al. (2016). Recommended amount of sleep for pediatric populations. Journal of Clinical Sleep Medicine, 12(6), 785-786."], "done": true}, {"n": 24, "c": "routine", "t": "寒假作業拖到最後一天怎麼辦？", "k": ["寒假作業", "作業拖延", "趕作業"], "a": "全體", "b": "作業拖到最後一天，常是不知道怎麼開始，而不是不想寫。大人一催，孩子反而更想逃。\n👉 這樣做：\n1️⃣ 一起把作業分成小份，貼在牆上\n2️⃣ 每天固定一小段時間（依年齡調整），完成就打勾\n3️⃣ 先從孩子最不抗拒的科目開始\n4️⃣ 卡住時陪在旁邊，不代寫\n5️⃣ 完成後給個小獎勵\n真的來不及，可以和老師溝通，說明狀況。\n💡 小提醒：不用追求完美，能一點一點完成就是進步，先看到孩子的努力，再討論下一步。", "s": ["Dawson, P. & Guare, R. (2010). Executive Skills in Children and Adolescents (2nd ed.). Guilford Press."], "done": true}, {"n": 25, "c": "routine", "t": "孩子放假一直喊無聊、吵不停？", "k": ["好無聊", "無聊", "吵鬧"], "a": "全體", "b": "孩子說「好無聊」，有時是想要你的關注，或是不知道可以做什麼。你不用每次都立刻幫他解決。\n👉 這樣做：\n1️⃣ 先回應：「你好像需要有點事做」\n2️⃣ 準備「無聊罐」：紙條寫上點子（畫畫、做點心、玩桌遊）\n3️⃣ 每天安排10分鐘一起做事\n4️⃣ 讓他先自己想辦法，卡住再給提示\n5️⃣ 手機不是第一選項\n陪他想辦法，比直接給答案更有效。\n💡 小提醒：孩子說無聊的時候，常是需要連結，一起做件小事，比任何娛樂都更能滿足他。", "s": ["（暫無直接來源，屬實務建議）"], "done": true}, {"n": 26, "c": "routine", "t": "年後孩子情緒低落、不想收心？", "k": ["收假", "年後", "開學前"], "a": "全體", "b": "長假結束，孩子可能情緒低落、易怒或特別黏人，這是正常的轉換反應。他需要一點時間，把心從放假的模式收回來。\n👉 這樣做：\n1️⃣ 開學前一週，把作息慢慢調回來\n2️⃣ 聊聊期待與擔心：「你最想跟同學說什麼？」\n3️⃣ 一起準備書包與用品\n4️⃣ 開學後多給幾天緩衝，不急著追進度\n若低落超過兩週，請與社工或老師討論。\n💡 小提醒：每個孩子的轉換速度不同，不用跟別人比，只要慢慢看到他恢復笑容、願意說話，就是好現象。", "s": ["Fahlberg, V. (1991). A Child's Journey Through Placement. Perspectives Press.", "NCTSN. Caring for Children Who Have Experienced Trauma."], "done": true}, {"n": 27, "c": "guide", "t": "孩子說謊怎麼辦？", "k": ["說謊", "騙人", "不誠實"], "a": "全體", "b": "孩子說謊，常是怕被罵、怕被丟掉，不是品格差。越被逼問，他越會躲。\n👉 這樣做：\n1️⃣ 別逼供，「你是不是又騙我？」會讓他更想躲\n2️⃣ 事實很明顯時直說：「我看到杯子破了，我們來處理」\n3️⃣ 他說實話時要稱讚：「謝謝你告訴我」\n4️⃣ 後果輕一點，讓說實話是安全的\n你是他可以說實話的人。孩子覺得安全，就不需要用謊話保護自己。\n💡 小提醒：發現說謊時，先想「他在怕什麼」，找到原因，比揭穿謊言更能幫助孩子改變。", "s": ["Talwar, V. & Lee, K. (2011). A punitive environment fosters children's dishonesty. Child Development, 82(6), 1751-1758.", "Purvis et al. (2007). The Connected Child."], "done": true}, {"n": 28, "c": "guide", "t": "孩子偷東西怎麼辦？", "k": ["偷東西", "偷竊", "拿別人東西"], "a": "全體", "b": "孩子拿別人的東西，可能是缺乏安全感、怕沒有，或還不懂界線。先弄清楚原因，比急著處罰更重要。\n👉 這樣做：\n1️⃣ 冷靜詢問：「這是從哪裡來的？」\n2️⃣ 說明規則：「這是別人的，要還回去」\n3️⃣ 陪他一起歸還、道歉，不羞辱\n4️⃣ 留意他缺什麼：食物？零用錢？關注？\n5️⃣ 不當眾說「小偷」\n若反覆發生，請與社工討論，一起找原因。\n💡 小提醒：處理的重點是教會孩子界線與負責，並讓他知道，犯錯後你還是會愛他。", "s": ["Keck, G. C. & Kupecky, R. M. (2002). Parenting the Hurt Child. NavPress.", "Purvis et al. (2007). The Connected Child."], "done": true}, {"n": 29, "c": "calm", "t": "孩子打人、咬人怎麼處理？", "k": ["打人", "咬人", "動手", "攻擊"], "a": "全體", "b": "打人、咬人時，先保護大家的安全，再處理情緒。你的冷靜，是孩子學會控制自己的第一步。\n👉 當下：\n1️⃣ 立刻隔開，語氣堅定：「不可以打人」\n2️⃣ 先照顧被打的人\n3️⃣ 孩子平靜後說：「生氣可以，打人不行」\n👉 事後：\n• 教替代做法：踩腳、抱枕、告訴大人\n• 觀察是否有固定觸發（累了、餓了、被搶玩具）\n⚠️ 不可體罰，也不要「以牙還牙」。\n💡 小提醒：孩子動手後常很後悔或害怕，平靜後給他一個擁抱，他會更願意學習新的做法。", "s": ["Siegel, D. & Bryson, T. P. (2014). No-Drama Discipline. Bantam.", "UN Committee on the Rights of the Child (2006). General Comment No. 8.", "NCTSN. Caring for Children Who Have Experienced Trauma."], "done": true}, {"n": 30, "c": "guide", "t": "孩子罵髒話怎麼辦？", "k": ["髒話", "罵人", "粗話"], "a": "全體", "b": "孩子罵髒話，可能是模仿、測試你的反應，或情緒太滿、找不到詞。你的反應越大，他越覺得有趣或有力量。\n👉 這樣做：\n1️⃣ 反應平淡，不要驚嚇或大笑\n2️⃣ 簡單說：「家裡不用這些詞，你可以說『我很生氣』」\n3️⃣ 教他情緒詞彙\n4️⃣ 大人也留意自己的用語\n5️⃣ 他沒說髒話時，記得稱讚\n持續穩定地回應，髒話會慢慢減少。\n💡 小提醒：孩子可能在學校或朋友間學到，不用過度責怪，用穩定的態度引導，他就會慢慢知道哪些話可以說。", "s": ["Kazdin, A. E. (2008). The Kazdin Method for Parenting the Defiant Child. Houghton Mifflin.", "Siegel & Bryson (2014). No-Drama Discipline."], "done": true}, {"n": 31, "c": "calm", "t": "孩子撞頭、抓咬自己，怎麼辦？", "k": ["自傷", "撞頭", "抓自己", "咬自己"], "a": "全體", "b": "孩子撞頭、抓咬自己，是在用身體處理說不出口的痛。看到會很心疼，但先別慌，穩定的你最重要。\n👉 這樣做：\n1️⃣ 先保護安全，用軟墊隔開，輕聲陪著\n2️⃣ 不責罵、不驚慌：「我看到你很難受」\n3️⃣ 平穩後再找方法：說出來、畫畫、聽音樂\n4️⃣ 記錄發生的情境（時間、前因）\n⚠️ 若受傷嚴重或反覆發生，請儘快與社工聯繫並就醫評估。你不必一個人處理。\n💡 小提醒：孩子不是想引人注意，而是正在承受很大的情緒，專業的協助能幫上大忙。", "s": ["Nock, M. K. (2010). Self-injury. Annual Review of Clinical Psychology, 6, 339-363.", "NCTSN. Caring for Children Who Have Experienced Trauma."], "done": true}, {"n": 32, "c": "guide", "t": "孩子一直頂嘴、不聽話？", "k": ["頂嘴", "不聽話", "唱反調", "不服從"], "a": "全體", "b": "孩子頂嘴，常是想被聽見，或想證明「我有自己的想法」。這其實也是在學習表達，只是方式還需要調整。\n👉 這樣做：\n1️⃣ 先別回嘴，深呼吸\n2️⃣ 聽他說完：「你覺得不公平，對嗎？」\n3️⃣ 說清楚底線：「可以不同意，但語氣要尊重」\n4️⃣ 事後再討論，不在吵架時處理\n5️⃣ 小事讓他做決定\n被聽見的孩子，通常比較願意聽你說話。\n💡 小提醒：給孩子一點表達的空間，他學會用好的方式說話，頂嘴就會慢慢減少。", "s": ["Faber, A. & Mazlish, E. (1980). How to Talk So Kids Will Listen & Listen So Kids Will Talk.", "Siegel & Bryson (2014). No-Drama Discipline."], "done": true}, {"n": 33, "c": "calm", "t": "孩子一點小事就爆炸、很容易發脾氣？", "k": ["易怒", "脾氣差", "玻璃心"], "a": "全體", "b": "一點小事就爆炸，常是壓力水位已經滿了，最後一滴水才讓他溢出來。與其事後處理，不如提早降低壓力。\n👉 這樣做：\n1️⃣ 找出容易爆炸的時段：餓了、累了、剛放學\n2️⃣ 事先補充：點心、休息、安靜時間\n3️⃣ 平時教「情緒溫度計」：1到5分，你現在幾分？\n4️⃣ 冒火時先降溫，再討論\n5️⃣ 記錄好的時刻，稱讚進步\n💡 小提醒：孩子爆炸後通常也很難受或很害怕，等平靜後給他一個擁抱，說「我還是在這裡」，比任何道理都有效。", "s": ["Greene, R. W. (1998). The Explosive Child. HarperCollins.", "Bath, H. (2008). Calming together. Reclaiming Children and Youth, 16(4), 44-46."], "done": true}, {"n": 34, "c": "guide", "t": "孩子總是怪別人、不承認錯誤？", "k": ["推卸責任", "怪別人", "不認錯"], "a": "全體", "b": "孩子總說「都是他害的」，通常是怕被責備、不敢面對，覺得承認錯誤就代表自己是壞孩子。\n👉 這樣做：\n1️⃣ 不急著判斷誰錯：「我們先看看發生什麼事」\n2️⃣ 把「人」和「行為」分開：「你不是壞孩子，這個行為不可以」\n3️⃣ 引導：「如果重來一次，你會怎麼做？」\n4️⃣ 他願意承認時，先肯定他的勇氣\n覺得安全，才敢承認；被羞辱，只會更想躲。\n💡 小提醒：用「我們一起想辦法」取代「你錯了」，孩子會感覺到你是站在他這邊的。", "s": ["Tangney, J. P. & Dearing, R. L. (2002). Shame and Guilt. Guilford Press.", "Siegel & Bryson (2014). No-Drama Discipline."], "done": true}, {"n": 35, "c": "guide", "t": "獎勵和處罰怎麼用才有效？", "k": ["獎勵", "處罰", "貼紙", "獎勵表", "懲罰"], "a": "全體", "b": "有效的管教，重點是「教」而不是「罰」。孩子需要知道該怎麼做，而不只是不能做什麼。\n👉 這樣做：\n1️⃣ 多鼓勵：看到好行為就立刻說出來\n2️⃣ 以關注、擁抱、一起玩為主，貼紙獎勵表為輔\n3️⃣ 一次只練一個目標\n4️⃣ 後果要合理、事先說好、與行為有關\n5️⃣ 避免體罰、羞辱，不要剝奪吃飯或見家人\n家中大人用一致的規則，孩子才不會困惑。\n💡 小提醒：教養需要時間，孩子可能會反覆，只要大人保持耐心與穩定，就是在進步。", "s": ["Sege, R. D., Siegel, B. S., & AAP (2018). Effective discipline to raise healthy children. Pediatrics, 142(6), e20183112.", "Kazdin, A. E. (2008). The Kazdin Method for Parenting the Defiant Child."], "done": true}, {"n": 36, "c": "health", "t": "孩子坐不住、很分心，是過動嗎？", "k": ["過動", "坐不住", "專注力", "分心"], "a": "全體", "b": "孩子坐不住、很分心，可能是年紀、壓力、創傷反應，也可能是注意力不足過動症（ADHD）。不要急著貼標籤，先觀察。\n👉 先這樣做：\n1️⃣ 觀察：什麼時候最明顯？在家、學校都有嗎？\n2️⃣ 指令簡短，一次一件事\n3️⃣ 減少干擾，安排動一動的時間\n4️⃣ 完成小任務就稱讚\n若持續半年以上、影響學習與生活，請與社工討論，帶孩子到兒童心智科評估。\n💡 小提醒：目前不建議自行判斷或標籤，專業評估能幫孩子找到真正合適的支持方式。", "s": ["Wolraich, M. L., et al. (2019). Clinical practice guideline for the diagnosis, evaluation, and treatment of ADHD. Pediatrics, 144(4), e20192528.", "American Psych   const ws=wb.Sheets['全年題庫'];if(!ws)return;
  const rows=XLSX.utils.sheet_to_json(ws,{defval:''});
  const col=(o,k)=>{const key=Object.keys(o).find(h=>String(h).startsWith(k));return key?String(o[key]).trim():''};
  const out=rows.filter(o=>col(o,'編號')&&col(o,'標題')).map(o=>{const n=parseInt(col(o,'編號'),10);return{
   n,c:NUMCAT[n]||THEMECAT[col(o,'月份主題')]||'special',t:col(o,'標題'),
   k:col(o,'關鍵字').split('、').map(s=>s.trim()).filter(Boolean),a:col(o,'適用對象'),
   b:col(o,'內文'),s:col(o,'來源').split('\n').map(s=>s.trim()).filter(Boolean),
   done:col(o,'撰寫狀態')==='已撰寫'&&!!col(o,'內文')}});
  if(out.length)DATA=out;
 }catch(e){}
}
const CATS=[
 {id:'trauma',n:'創傷知情：讀懂孩子的行為',d:'孩子的許多反應和過去的經驗有關。先理解「他是在害怕」，再決定怎麼回應。',f:1},
 {id:'calm',n:'安撫孩子的生氣與情緒',d:'哭鬧、暴怒、打人、一點小事就爆炸時，先顧安全、穩住自己，再陪孩子平靜下來。',f:1},
 {id:'expect',n:'回應孩子的期待與想念',d:'孩子問「什麼時候回家」、想念爸媽、要求很多時，怎麼誠實又溫暖地回應。',f:1},
 {id:'settle',n:'新生活適應',d:'剛到家的頭幾週、睡眠、洗澡、黏人、和家裡其他孩子相處。'},
 {id:'guide',n:'管教與行為引導',d:'說謊、偷東西、罵髒話、頂嘴，以及獎勵和處罰怎麼用。'},
 {id:'bond',n:'依附與關係修復',d:'建立信任、每日陪伴，以及說了重話之後怎麼修復關係。'},
 {id:'family',n:'原生家庭與探視',d:'探視前後的情緒、孩子的忠誠感，以及怎麼談孩子自己的故事。'},
 {id:'routine',n:'假期與生活作息',d:'寒暑假安排、過年、紅包、賴床、作業拖延與收心。'},
 {id:'school',n:'學校與學習',d:'拒學、被欺負、功課落後、和老師溝通、特教資源。'},
 {id:'screen',n:'手機與網路',d:'3C使用約定、網路交友與社群帳號。'},
 {id:'health',n:'發展與健康',d:'專注力、發展遲緩、早期療育、就醫與日常健康。'},
 {id:'teen',n:'青少年',d:'溝通、叛逆、戀愛、隱私界線與生涯探索。'},
 {id:'special',n:'特殊情況與轉銜',d:'孩子說出受傷經驗、失落悲傷、返家、收養與自立準備。'},
 {id:'self',n:'照顧者自我照顧',d:'照顧者也需要被照顧：疲憊、自責、喘息服務與支持網絡。'}
];
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const st={cat:'all',q:'',todo:false};
try{st.todo=localStorage.getItem('qa-todo')==='1'}catch(e){}
$('#showTodo').checked=st.todo;
const done=c=>DATA.filter(x=>x.done&&(c==='all'||x.c===c)).length;
const plan=c=>DATA.filter(x=>c==='all'||x.c===c).length;

function renderIndex(){
 $('#index').innerHTML=CATS.map(c=>`<button class="idx${c.f?' feat':''}${st.cat===c.id?' on':''}" data-c="${c.id}"><b>${c.n}</b><span>${done(c.id)?done(c.id)+' 則問答':'即將推出'}</span></button>`).join('');
 $('#chips').innerHTML=[{id:'all',n:'全部'}].concat(CATS).map(c=>`<button class="chip${st.cat===c.id?' on':''}" data-c="${c.id}">${c.id==='all'?'全部':c.n.replace(/：.*/,'')}</button>`).join('');
}
function hl(t,q){
 const e=esc(t);if(!q)return e;
 const qq=esc(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
 return e.replace(new RegExp(qq,'g'),m=>`<mark>${m}</mark>`);
}
function item(x,q){
 const cat=CATS.find(c=>c.id===x.c);
 if(!x.done)return `<details class="q todo"><summary onclick="event.preventDefault()"><span class="no">${x.n}</span><span class="qt">${hl(x.t,q)}<small>${cat.n}</small></span><span class="tag">撰寫中</span></summary></details>`;
 return `<details class="q" id="q${x.n}"${q?' open':''}><summary><span class="no">${x.n}</span><span class="qt">${hl(x.t,q)}${st.cat==='all'||q?`<small>${cat.n}</small>`:''}</span><svg class="arr" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></summary>
 <div class="body"><p class="ans">${hl(x.b,q)}</p>
 <div class="meta"><em>LINE關鍵字</em>${x.k.map(k=>`<button class="kw" data-k="${esc(k)}">${hl(k,q)}</button>`).join('')}${x.a&&x.a!=='全體'?`<span class="who">特別適用：${esc(x.a)}</span>`:''}</div>
 ${x.s.length?`<details class="src"><summary>參考資料（${x.s.length}）</summary><ul>${x.s.map(s=>`<li>${esc(s)}</li>`).join('')}</ul></details>`:''}
 </div></details>`;
}
function render(){
 renderIndex();
 const q=st.q.trim();
 let rows=q?DATA.filter(x=>(x.t+x.k.join(' ')+x.b).includes(q)):DATA.filter(x=>st.cat==='all'||x.c===st.cat);
 const shown=rows.filter(x=>x.done||st.todo);
 const cat=CATS.find(c=>c.id===st.cat);
 $('#ht').textContent=q?`搜尋「${q}」`:(cat?cat.n:'全部問答');
 const n=rows.filter(x=>x.done).length,p=rows.length-n;
 $('#hd').textContent=(q?`找到 ${n} 則問答`:(cat?cat.d+' ':'')+`目前有 ${n} 則問答`)+(p?`，另有 ${p} 則撰寫中。`:'。');
 $('#list').innerHTML=shown.length?shown.map(x=>item(x,q)).join(''):`<div class="empty">${q?(p&&!st.todo?'相關題目還在撰寫中，可勾選「顯示即將推出的題目」查看。':'找不到相關問答，試試其他說法，例如「生氣」「哭」「回家」。'):'這個分類的問答正在撰寫中，敬請期待。'}</div>`;
}
function go(c,scroll){
 st.cat=c;
 try{history.replaceState(null,'',c==='all'?location.pathname+location.search:'#'+c)}catch(e){location.hash=c==='all'?'':c}
 render();
 if(scroll)document.querySelector('main').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
 const on=document.querySelector('.chip.on');if(on)on.scrollIntoView({block:'nearest',inline:'center'});
}
function fromHash(){const h=location.hash.slice(1);st.cat=CATS.some(c=>c.id===h)?h:'all';render()}
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-c]');
 if(b){const c=b.dataset.c;st.q='';$('#q').value='';go(st.cat===c&&b.classList.contains('idx')?'all':c,b.classList.contains('idx'));return}
 const k=e.target.closest('[data-k]');
 if(k){st.q=k.dataset.k;$('#q').value=st.q;st.cat='all';go('all',true)}
});
$('#q').addEventListener('input',e=>{st.q=e.target.value;if(st.q.trim()&&st.cat!=='all')go('all');else render()});
$('#sf').addEventListener('submit',e=>{e.preventDefault();$('#q').blur();document.querySelector('main').scrollIntoView()});
$('#clr').addEventListener('click',()=>{st.q='';$('#q').value='';render();$('#q').focus()});
$('#showTodo').addEventListener('change',e=>{st.todo=e.target.checked;try{localStorage.setItem('qa-todo',st.todo?'1':'0')}catch(_){}render()});
$('#back').addEventListener('click',()=>$('#index').scrollIntoView());
window.addEventListener('hashchange',fromHash);
loadXlsx().then(fromHash);
}
</script>
</body>
</html>
